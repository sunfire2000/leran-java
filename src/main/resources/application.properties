# ==============================
# 服务器配置
# ==============================
# 应用启动后监听的端口号，访问地址为 http://localhost:8081
server.port=8081

# 强制 UTF-8 编码，解决中文乱码问题
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ==============================
# MySQL 数据库配置
# ==============================
# 数据库连接地址：localhost:3306 是 MySQL 默认端口，learn_java 是数据库名
# 需要先在 MySQL 中手动创建 learn_java 数据库
spring.datasource.url=jdbc:mysql://localhost:3306/learn_java?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8
# 数据库驱动类名，MySQL 使用 com.mysql.cj.jdbc.Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# 数据库连接用户名（根据你的 MySQL 配置修改）
spring.datasource.username=root
# 数据库连接密码（根据你的 MySQL 配置修改）
spring.datasource.password=root

# ==============================
# JPA / Hibernate 配置
# ==============================
# 指定数据库方言为 MySQL，Hibernate 会根据方言生成对应的 SQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# DDL 自动管理策略：update = 根据实体类自动创建/更新表结构（开发环境推荐）
# 其他选项：create（每次重启重建）、create-drop（启动时建表，停止时删表）、validate（只验证不修改）
spring.jpa.hibernate.ddl-auto=update
# 在控制台打印执行的 SQL 语句，方便调试和学习
spring.jpa.show-sql=true
# 关闭 open-in-view，避免 DevTools 热重启时 JPA 仓库扫描失败
spring.jpa.open-in-view=false

# ==============================
# JWT 配置
# ==============================
# JWT 签名密钥（Base64 编码）
# 用于生成和验证 Token 的签名，必须保密！
# 生产环境应使用更复杂的密钥，并通过环境变量注入
jwt.secret=TXlTZWN1cmVTZWNyZXRLZXlGb3JMZWFybkphdmFQcm9qZWN0MjAyNg==
# Token 有效期（毫秒）：86400000 毫秒 = 24 小时
# 超过这个时间 Token 会过期，用户需要重新登录
jwt.expiration=86400000
